name: dogfood
# The repo's complete portable TESTING.md pipeline runs under the release-built
# litci binary. Docker/provider/whole-run performance gates remain in their
# explicit capability-owning jobs in ci.yml. GitHub never auto-runs this
# shell-only workflow.
#   invoke: litci run -W .github/workflows/dogfood.yml \
#             -e workflow_dispatch --allow-degraded
on: workflow_dispatch

env:
  CARGO_TERM_COLOR: always
  # Keep build artifacts off the merged workspace: the host repo's target/
  # sits in the read-only lower layer; building over it would fight stale
  # host fingerprints and bloat the overlay upper (or copy-in tree).
  CARGO_TARGET_DIR: /tmp/dogfood-target

jobs:
  gates:
    runs-on: homelab-heavy
    container:
      # Matches rust-toolchain.toml and is immutable across both executors.
      image: rust@sha256:58fe97504a0e4cbba5d85599619a589923d3e779472a6fb0840d58d1c4ba99d7
    defaults:
      run:
        shell: bash # job containers default to sh -e {0}
    steps:
      - name: Provision toolchain components
        run: |
          rustc --version
          rustup component add rustfmt clippy
          rustup target add x86_64-unknown-linux-musl # greenlit-init sub-build
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        timeout-minutes: 45
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Install pinned cargo-deny
        timeout-minutes: 20
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Dependency policy
        run: cargo deny check
      - name: Stub registry consistency
        run: |
          command -v python3 >/dev/null || { apt-get update && apt-get install -y --no-install-recommends python3; }
          python3 tools/check-stubs
      - name: Stabilization ledger consistency
        run: |
          python3 tools/check-stabilization-ledger
          python3 tools/check-stabilization-ledger --self-test-negative
      - name: Test authority
        run: |
          python3 tools/check-test-authority
          python3 tools/check-test-authority --self-test-negative
      - name: Capability target command manifest
        run: |
          python3 tools/tests/check-portable-test-manifest
          python3 tools/tests/check-portable-test-manifest --self-test-negative
          python3 tools/tests/check-capability-test-manifest
          python3 tools/tests/check-capability-test-manifest --self-test-negative
      - name: Parity comparator contract
        run: |
          python3 tools/compare-parity --self-test
          python3 tools/tests/check-parity-producer
      - name: Test
        timeout-minutes: 45
        run: python3 tools/tests/check-portable-test-manifest --run
      - name: Docs (warnings denied)
        timeout-minutes: 45
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps
      - name: Criterion benchmark manifest
        timeout-minutes: 45
        run: python3 tools/tests/check-criterion-manifest
