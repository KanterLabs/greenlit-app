name: CI

# TESTING.md "Internal CI" — every PR, in order, fail-fast:
#   1. cargo fmt --check
#   2. cargo clippy --all-targets -- -D warnings
#   3. cargo deny check
#   4. tools/check-stubs
#   5. tools/check-stabilization-ledger
#   6. tools/tests/check-portable-test-manifest --run
#   7. cargo doc --workspace --no-deps (warnings denied)
#   8. the manifest-authoritative Criterion gate plus the required native
#      whole-run budget gate
#
# Plus the `dogfood` job below: from Phase 4 onward TESTING.md makes running
# this repository's own gates under Greenlit itself a *required* CI step.
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The homelab runner and its DinD sidecar share runner.temp. Host paths
  # created under the runner container's private /tmp are invisible to Docker.
  TMPDIR: /home/runner/_work/_temp

permissions:
  actions: read
  contents: read

jobs:
  ci:
    name: portable fmt, clippy, deny, checkers, test, doc, bench
    runs-on: homelab-heavy
    env:
      # The host-only DinD path above is not translated into a job container.
      TMPDIR: /tmp
    # Keep the portable gates independent of whatever happens to be installed
    # on a runner host. The exact digest is also retained in Greenlit's
    # RunLock, so both GitHub and local runs see the same Rust userspace.
    container:
      image: rust:1.96.0@sha256:58fe97504a0e4cbba5d85599619a589923d3e779472a6fb0840d58d1c4ba99d7
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      # rust-toolchain.toml pins the components and musl target used by the
      # workspace. The image already supplies the exact Rust release.
      - name: Provision pinned Rust toolchain
        run: |
          rustc --version
          rustup component add rustfmt clippy
          rustup target add x86_64-unknown-linux-musl

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      # 1. cargo fmt --check
      - name: Format check
        run: cargo fmt --all -- --check

      # 2. cargo clippy --all-targets -- -D warnings
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      # 3. cargo deny check
      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2

      - name: Dependency policy (licenses, advisories, bans, sources)
        run: cargo deny check

      # 4. tools/check-stubs
      - name: Stub registry consistency
        run: |
          command -v python3 >/dev/null || {
            apt-get update
            apt-get install -y --no-install-recommends python3
          }
          python3 tools/check-stubs

      # 5. stabilization defect and parity-exception ledgers
      - name: Stabilization ledger consistency
        run: |
          python3 tools/check-stabilization-ledger
          python3 tools/check-stabilization-ledger --self-test-negative

      - name: Test authority
        run: |
          tools/check-test-authority
          tools/check-test-authority --self-test-negative

      - name: Capability target command manifest
        run: |
          tools/tests/check-portable-test-manifest
          tools/tests/check-portable-test-manifest --self-test-negative
          tools/tests/check-capability-test-manifest
          tools/tests/check-capability-test-manifest --self-test-negative

      - name: Parity comparator contract
        run: |
          /usr/bin/python3 -I -B \
            tools/release_check_credential.py --self-test
          tools/tests/check-release-transfer-bundles
          tools/tests/check-release-provenance-temp
          tools/compare-parity --self-test
          tools/tests/check-parity-producer

      # 6. The exact manifest-derived portable oracle, integration, and
      # invariant targets. Capability-owned targets run in the host jobs below.
      # Docker-dependent app targets require the `live-runtime-tests` feature
      # and are owned by the host capability jobs below.
      - name: Test
        run: tools/tests/check-portable-test-manifest --run

      # 7. RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
      - name: Docs (warnings denied)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --workspace --no-deps

      # 8. The manifest gate lists and samples every declared Criterion name;
      # the performance-policy job below owns whole-run Phase 10 budgets.
      - name: Criterion benchmark manifest
        run: tools/tests/check-criterion-manifest

  # A workflow job container intentionally cannot receive the host Docker
  # socket. Keep the real-daemon acceptance on the heavy runner, while the
  # portable suite above remains identical locally and on GitHub.
  runtime-integration:
    name: real Docker executor acceptance
    needs: ci
    runs-on: homelab-heavy
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Provision pinned Rust toolchain
        run: rustup show

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Require native Docker capability
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          docker info >/dev/null

      - name: Provision privileged copy-strategy prerequisites
        run: |
          test "$(/usr/bin/uname -s)" = Linux
          test "$(/usr/bin/uname -m)" = x86_64
          test -x /usr/bin/docker
          /usr/bin/docker info >/dev/null

      - name: Reflink and bounded-stream copy strategies
        run: |
          cargo build --locked -p greenlit-init --profile init \
            --target x86_64-unknown-linux-musl
          tools/test-copy-strategy-capability \
            target/x86_64-unknown-linux-musl/init/greenlit-init

      # The real-daemon executor tests begin at the post-RunLock boundary.
      # Provision the exact locked profile up front: once execution begins,
      # Greenlit correctly refuses to replace a missing locked image.
      - name: Prepare pinned runner profile
        run: docker pull ghcr.io/actions/actions-runner@sha256:a1919047b038c38871d667c58cfdc7a878452711ab1212fb6036188f27a7ab16

      - name: Run real-daemon executor tests
        run: tools/tests/check-capability-test-manifest --run-owner docker-runtime

  credential-capability:
    name: isolated persistent-keyring acceptance
    needs: ci
    runs-on: homelab-heavy
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Provision pinned Rust toolchain
        run: rustup show

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Provision isolated keyring prerequisites
        run: |
          test "$(/usr/bin/uname -s)" = Linux
          test "$(/usr/bin/uname -m)" = x86_64
          test -x /usr/bin/unshare
          keyutils_root="$RUNNER_TEMP/greenlit-keyutils"
          tools/tests/provision-keyctl "$keyutils_root"
          printf '%s\n' "$keyutils_root/package/usr/bin" >> "$GITHUB_PATH"

      - name: Run production persistent-keyring acceptance
        run: tools/test-credential-capability

  host-deep-path:
    name: native beyond-PATH_MAX filesystem invariant
    needs: ci
    runs-on: homelab-heavy
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Provision pinned Rust toolchain
        run: rustup show

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Require native writable tmpfs
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test -d /dev/shm
          test -w /dev/shm
          test "$(stat -f -c %T /dev/shm)" = tmpfs

      - name: Run manifest-owned beyond-PATH_MAX invariant
        run: tools/tests/check-capability-test-manifest --run-owner host-deep-path

  # TESTING.md snapshotter-path coverage forbids capability self-skips. This
  # job provisions a real, isolated containerd/stargz stack and runs the direct
  # provider acceptance.
  provider-and-policy:
    name: configured stargz provider
    needs: runtime-integration
    runs-on: homelab-heavy
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Provision pinned Rust toolchain
        run: rustup show

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Require native Docker capability
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          docker info >/dev/null

      - name: Direct containerd/stargz provider
        run: tools/test-stargz-provider

  # Keep the native performance authority on a fresh ARC pod and private DinD
  # daemon so earlier provider work cannot warm or contaminate its runtime.
  performance-policy:
    name: native performance and policy modes
    needs: runtime-integration
    runs-on: homelab-heavy
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Provision pinned Rust toolchain
        run: rustup show

      - name: Require native Docker capability
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          docker info >/dev/null

      - name: Clean, hermetic, and native performance policy
        run: |
          unset RUSTC_WRAPPER
          GREENLIT_BUILD_COMMIT="$GITHUB_SHA" \
            tools/tests/check-capability-test-manifest --run-owner docker-policy

  live_parity_local:
    name: tokenless same-SHA oracle and Greenlit evidence
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/heads/stabilization/'))
    needs: ci
    runs-on: homelab-heavy
    outputs:
      local_sha256: ${{ steps.local_digest.outputs.sha256 }}
    steps:
      - name: Check out exact source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare branch-backed source identity
        run: |
          ! /usr/bin/git config --local --get-regexp \
            '^(http\..*\.extraheader|credential(\..*)?\.helper)$' \
            >/dev/null 2>&1
          test "$GITHUB_REF_TYPE" = branch
          test "$GITHUB_REF" = "refs/heads/$GITHUB_REF_NAME"
          case "$GITHUB_REF_NAME" in
            main|stabilization/*) ;;
            *) exit 1 ;;
          esac
          git switch -C "$GITHUB_REF_NAME" "$GITHUB_SHA"
          test "$(git branch --show-current)" = "$GITHUB_REF_NAME"

      - name: Provision pinned Rust toolchain
        run: rustup show

      - name: Require live parity capabilities
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          command -v python3 >/dev/null
          docker info >/dev/null
          docker pull ghcr.io/actions/actions-runner@sha256:a1919047b038c38871d667c58cfdc7a878452711ab1212fb6036188f27a7ab16

      - name: Build exact release binary outside the checkout
        env:
          GREENLIT_BUILD_COMMIT: ${{ github.sha }}
        run: |
          parity_build="${RUNNER_TEMP}/greenlit-parity-release-target"
          parity_binary_root="${RUNNER_TEMP}/greenlit-parity-release-binary"
          test ! -e "$parity_build"
          test ! -e "$parity_binary_root"
          install -d -m 000700 "$parity_build"
          install -d -m 000700 "$parity_binary_root"
          install -d -m 000700 "$parity_binary_root/release"
          CARGO_TARGET_DIR="$parity_build" \
            cargo build --locked --release -p greenlit-app --bin litci
          /usr/bin/install \
            -m 0755 \
            "$parity_build/release/litci" \
            "$parity_binary_root/release/litci"
          test ! -L "$parity_binary_root/release/litci"
          test -f "$parity_binary_root/release/litci"
          test -x "$parity_binary_root/release/litci"
          test "$(/usr/bin/stat -c %h "$parity_binary_root/release/litci")" = 1

      - name: Produce tokenless local evidence
        env:
          GREENLIT_BUILD_COMMIT: ${{ github.sha }}
        run: |
          parity_binary_root="${RUNNER_TEMP}/greenlit-parity-release-binary"
          parity_output="${RUNNER_TEMP}/greenlit-live-local"
          test ! -e "$parity_output"
          install -d -m 000700 "$parity_output"
          tools/check-live-parity local \
            --repository-root "$GITHUB_WORKSPACE" \
            --greenlit-binary "$parity_binary_root/release/litci" \
            --output-root "$parity_output"

      - name: Seal local evidence and binary
        id: local_digest
        run: |
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/target/ci-live-local.tar"
          install -d -m 000700 "$GITHUB_WORKSPACE/target"
          digest="$(
            /usr/bin/python3 -I -B \
              tools/release_check_credential_bundle.py pack-local \
              --input-root "$RUNNER_TEMP/greenlit-live-local" \
              --greenlit-binary \
                "$RUNNER_TEMP/greenlit-parity-release-binary/release/litci" \
              --output "$bundle" \
              --expected-source "$GITHUB_SHA"
          )"
          printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Upload exact local evidence bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: greenlit-ci-live-local
          path: target/ci-live-local.tar
          if-no-files-found: error

  live_parity_github:
    name: credential-only same-SHA GitHub observation
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/heads/stabilization/'))
    needs: ci
    runs-on: homelab
    outputs:
      github_sha256: ${{ steps.github_digest.outputs.sha256 }}
    steps:
      - name: Check out exact source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare credential-only boundary
        run: |
          ! /usr/bin/git config --local --get-regexp \
            '^(http\..*\.extraheader|credential(\..*)?\.helper)$' \
            >/dev/null 2>&1
          git switch -C greenlit-live-github "$GITHUB_SHA"
          command -v /usr/bin/python3 >/dev/null
          command -v /usr/local/bin/gh >/dev/null
          output="$RUNNER_TEMP/greenlit-live-github"
          test ! -e "$output"
          install -d -m 000700 "$output"
          /usr/bin/python3 -I -B \
            tools/release_check_credential.py --self-test

      - name: Collect GitHub evidence with no candidate present
        env:
          GH_TOKEN: ${{ github.token }}
          GREENLIT_BUILD_COMMIT: ${{ github.sha }}
        run: >-
          exec /usr/bin/python3 -I -B
          tools/check-live-parity github
          --repository-root "$GITHUB_WORKSPACE"
          --output-root "$RUNNER_TEMP/greenlit-live-github"

      - name: Seal GitHub evidence
        id: github_digest
        run: |
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/target/ci-live-github.tar"
          install -d -m 000700 "$GITHUB_WORKSPACE/target"
          digest="$(
            /usr/bin/python3 -I -B \
              tools/release_check_credential_bundle.py pack-github \
              --input-root "$RUNNER_TEMP/greenlit-live-github" \
              --output "$bundle" \
              --expected-source "$GITHUB_SHA"
          )"
          printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Upload exact GitHub evidence bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: greenlit-ci-live-github
          path: target/ci-live-github.tar
          if-no-files-found: error

  live_parity_compare:
    name: tokenless same-SHA parity comparison
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/heads/stabilization/'))
    needs:
      - live_parity_local
      - live_parity_github
    runs-on: homelab-heavy
    steps:
      - name: Check out exact source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare exact comparison source
        run: |
          ! /usr/bin/git config --local --get-regexp \
            '^(http\..*\.extraheader|credential(\..*)?\.helper)$' \
            >/dev/null 2>&1
          git switch -C greenlit-live-compare "$GITHUB_SHA"

      - name: Download local evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: greenlit-ci-live-local
          path: ${{ runner.temp }}/greenlit-ci-live-local

      - name: Download GitHub evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: greenlit-ci-live-github
          path: ${{ runner.temp }}/greenlit-ci-live-github

      - name: Verify, merge, and compare exact evidence
        env:
          GREENLIT_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          local_bundle="$RUNNER_TEMP/greenlit-ci-live-local/ci-live-local.tar"
          github_bundle="$RUNNER_TEMP/greenlit-ci-live-github/ci-live-github.tar"
          local_root="$RUNNER_TEMP/greenlit-ci-live-local-unpacked"
          github_root="$RUNNER_TEMP/greenlit-ci-live-github-unpacked"
          output="$RUNNER_TEMP/greenlit-live-parity"
          chmod 0600 "$local_bundle" "$github_bundle"
          /usr/bin/python3 -I -B \
            tools/release_check_credential_bundle.py unpack-local \
            --bundle "$local_bundle" \
            --output-root "$local_root" \
            --expected-sha256 "${{ needs.live_parity_local.outputs.local_sha256 }}" \
            --expected-source "$GITHUB_SHA"
          /usr/bin/python3 -I -B \
            tools/release_check_credential_bundle.py unpack-github \
            --bundle "$github_bundle" \
            --output-root "$github_root" \
            --expected-sha256 "${{ needs.live_parity_github.outputs.github_sha256 }}" \
            --expected-source "$GITHUB_SHA"
          mv "$local_root/parity" "$output"
          mv "$github_root/parity/seed-github-actions.json" "$output/"
          mv \
            "$github_root/parity/captures/shell-only-seed-github-actions.json" \
            "$output/captures/"
          tools/check-live-parity compare \
            --repository-root "$GITHUB_WORKSPACE" \
            --greenlit-binary "$local_root/binary/litci" \
            --output-root "$output"

      - name: Upload exact compared live parity evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: greenlit-live-parity
          path: ${{ runner.temp }}/greenlit-live-parity/
          if-no-files-found: error

  # TESTING.md "Dogfood clause": "from Phase 2 onward this repo's own workflow
  # must run green under Greenlit itself, and that run is a required CI step
  # from Phase 4 onward. A CI tool whose repo can't run its own CI locally has
  # failed its founding premise."
  #
  # The dedicated workflow supplies its repository-declared Rust toolchain
  # through an immutable job container. The locked ARC runner profile is
  # intentionally not inferred to contain GitHub-hosted runner toolcache
  # contents such as rustup.
  dogfood:
    name: two release-built degraded dogfood runs
    needs:
      - provider-and-policy
      - performance-policy
      - credential-capability
      - host-deep-path
    runs-on: homelab-heavy
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pull-request checkouts are detached merge commits. A synthetic manual
      # dispatch still has a selected ref, so give that exact SHA a local
      # branch instead of asking Greenlit to invent one.
      - name: Prepare branch-backed source identity
        run: git switch -C greenlit-ci "$GITHUB_SHA"

      - name: Provision pinned Rust toolchain
        run: rustup show

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Build litci
        env:
          GREENLIT_BUILD_COMMIT: ${{ github.sha }}
        run: cargo build --locked --release -p greenlit-app

      # Each invocation gets a fresh host evidence home. The inner workflow
      # runs the complete portable TESTING.md pipeline, while its target dir
      # stays off the read-only source lower layer.
      - name: Run and verify repository gates under Greenlit twice
        env:
          CARGO_TARGET_DIR: /tmp/dogfood-target
        run: tools/check-release-dogfood target/release/litci
