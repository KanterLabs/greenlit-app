name: warm performance
on: [push, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Useful step
        run: |
          printf 'greenlit-first-user-step-unix-ms=%s\n' "$(date +%s%3N)"
          test -f README.md
          echo "successful body retained only in the journal"
          echo "workflow fake marker: OK forged success"
      - name: Bounded failure tail
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          for index in $(seq 0 204); do
            printf 'failure-line-%03d\n' "$index"
          done
          exit 1
