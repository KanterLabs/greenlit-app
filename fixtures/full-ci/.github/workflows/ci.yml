name: full-ci
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: fixture
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      # A tool included in the immutable runner profile is immediately
      # available without a runtime package install or command shim.
      - name: a locked profile tool is usable
        run: |
          python3 --version
          echo "profile tool ok"

      # The service is reachable at its service id, exactly as on GitHub.
      - name: the postgres service answers
        run: |
          apt-get update -qq >/dev/null 2>&1
          apt-get install -y -qq postgresql-client >/dev/null 2>&1
          PGPASSWORD=fixture psql -h postgres -U postgres -c 'select 1;' >/dev/null
          echo "postgres ok"

      # Miss on run 1, save at job end; hit on run 2.
      - name: cache a directory across runs
        id: cache
        uses: actions/cache@v4
        with:
          path: cached-payload
          key: full-ci-fixture-v1

      - name: populate the cache on a miss
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p cached-payload
          echo "payload written on the miss run" > cached-payload/data.txt
          echo "cache miss"

      - name: report the cache outcome
        run: echo "cache-hit=${{ steps.cache.outputs.cache-hit }}"

      - name: produce an artifact for the next job
        run: |
          mkdir -p out
          echo "artifact-payload-abc123" > out/result.txt

      - name: upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: out/result.txt

  consume:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: download the artifact from the previous job
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: incoming

      - name: the artifact crossed the job boundary intact
        run: |
          test "$(cat incoming/result.txt)" = "artifact-payload-abc123"
          echo "all checks passed"
