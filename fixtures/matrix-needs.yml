# Phase 1 exit-criteria fixture (`PHASE-1-engine-core.md`): 3 jobs, a
# `strategy.matrix` using both `include` (adding a new key to an existing
# combo) and `exclude` (removing combos by partial key match), a 3-job
# `needs` chain where the third job needs both of the first two, a declared
# job output consumed downstream via `needs.<id>.outputs.<name>`, and a mix
# of a statically-evaluable `if:` (`github.event_name`) and a
# runtime-deferred one (`needs.<id>.result`). This fixture must plan
# successfully with no `--var`/`.litci/vars` overrides -- it is the exact
# fixture the Phase 1 exit criteria and `crates/greenlit-app/tests/` drive.
name: matrix-needs fixture
on:
  push:
    branches: [main]

env:
  GREETING: hello

jobs:
  build:
    # GitHub resolves `matrix.os` separately for every expanded job:
    # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idstrategymatrix
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        channel: [stable, beta]
        # GitHub specifies that an excluded configuration need only be a
        # partial match, so this removes both `channel: beta` combinations:
        # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idstrategymatrixexclude
        exclude:
          - channel: beta
        # Adds a new key to the one surviving combo it matches
        # (`os: ubuntu-24.04, channel: stable`) rather than creating a
        # standalone leg.
        include:
          - os: ubuntu-24.04
            channel: stable
            canary: true
    outputs:
      # Step outputs are produced while a job runs, so planning preserves
      # this expression for runtime evaluation. The plan contract is pinned
      # by `crates/greenlit-app/tests/plan_matrix_needs.rs` in
      # `job_output_is_deferred_and_consumed_by_a_downstream_jobs_output`.
      artifact-name: ${{ steps.pack.outputs.name }}
    steps:
      - id: pack
        name: Package build artifact
        run: |
          echo "name=build-artifact" >> "$GITHUB_OUTPUT"

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Run unit tests
        run: echo running tests
      - name: Upload coverage
        # `needs.<job_id>.result` contains the completed dependency result:
        # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#needs-context
        if: needs.build.result == 'success'
        run: echo "uploading coverage for ${{ needs.build.outputs.artifact-name }}"

  deploy:
    needs: [build, test]
    runs-on: ubuntu-latest
    # The synthetic push event makes this statically true; the integration
    # contract is pinned by `crates/greenlit-app/tests/plan_matrix_needs.rs`
    # in `static_and_deferred_if_conditions_are_both_present`.
    if: github.event_name == 'push'
    outputs:
      # Consumes `build`'s declared output across the needs edge -- also
      # deferred, since `build.outputs.artifact-name` is itself deferred.
      release-tag: ${{ needs.build.outputs.artifact-name }}-deployed
    steps:
      - name: Deploy artifact
        run: echo "deploying ${{ needs.build.outputs.artifact-name }}"
