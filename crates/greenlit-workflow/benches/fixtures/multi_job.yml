name: CI

on:
  push:
    branches: [main, staging]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      debug:
        description: "Enable debug logging"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: info

defaults:
  run:
    shell: bash

permissions:
  contents: read
  pull-requests: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
    steps:
      - id: compute
        name: Compute matrix
        run: echo "matrix=[\"stable\",\"beta\"]" >> "$GITHUB_OUTPUT"

  test:
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
        toolchain: [stable, beta]
        include:
          - os: ubuntu-latest
            toolchain: stable
            coverage: true
        exclude:
          - os: ubuntu-22.04
            toolchain: beta
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
    container:
      image: rust:1.82-slim
      env:
        DATABASE_URL: postgres://postgres@postgres/test
    env:
      TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          token: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Restore cache
        if: ${{ vars.ENABLE_CACHE == 'true' }}
        run: echo "restoring cache for ${{ vars.CACHE_KEY }}"

      - name: Run tests
        run: cargo test --workspace
        env:
          RUSTFLAGS: -D warnings
        timeout-minutes: 20
        continue-on-error: ${{ matrix.toolchain == 'beta' }}

      - name: Upload coverage
        if: ${{ success() && matrix.coverage }}
        run: echo "uploading coverage"

  publish:
    needs: [setup, test]
    if: ${{ github.ref == 'refs/heads/main' && !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish
        run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }}
        working-directory: crates/greenlit-workflow
