[package]
name = "greenlit-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Planner: turns (workflow, event, contexts) into a resolved ExecutionPlan."

[dependencies]
# The typed workflow model this crate plans against. `version` is pinned
# alongside `path` (both required together, per this workspace's
# `deny.toml` `bans.wildcards = "deny"` policy — a path-only dependency
# with no version requirement is flagged as a "wildcard dependency").
greenlit-workflow = { path = "../greenlit-workflow", version = "0.1.0" }
# The `${{ }}` parser/evaluator/context model this crate's partial evaluator
# builds on directly (see `crate::partial_eval`).
greenlit-expr = { path = "../greenlit-expr", version = "0.1.0" }
# Typed errors for every fallible path, per `AGENTS.md` "Errors: thiserror in
# library crates".
thiserror = "2.0.19"
# `ExecutionPlan` and its constituent types derive `Serialize` so
# `greenlit-app` can produce the stable `litci plan --json` document directly
# from this crate's types without re-deriving the stable plan schema.
serde = { version = "1.0.229", features = ["derive"] }
# Streams the stable plan representation into a bounded byte counter while
# planning, preventing matrix/context amplification before CLI rendering.
serde_json = "1.0.151"
# Order-preserving maps: matrix axis/leg keys, env layers, and job outputs
# all have declaration-order-significant iteration under GitHub's documented
# matrix ordering and the byte-stable JSON contract. Built with the `serde`
# feature so it participates directly in the derives above.
indexmap = { version = "2.14.0", features = ["serde"] }
# Named evaluation/assembly spans are consumed by greenlit-metrics' local
# timing layer when the engine is called from `litci`.
tracing = "0.1.44"
# GitHub trigger filters use a documented glob grammar whose `?` and `+`
# quantifiers differ from filesystem glob crates. The event matcher compiles
# that grammar to anchored regular expressions.
regex = "1.13.1"
# Canonical source trees, locks, and result evidence use SHA-256 identities.
# The same version is already pinned by greenlit-expr and greenlit-runtime.
sha2 = "0.11.0"

[dev-dependencies]
# Public source-snapshot contracts use isolated Git repositories.
tempfile = "3.27.0"
