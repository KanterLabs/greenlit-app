[package]
name = "greenlit-expr"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "GitHub Actions ${{ }} expression lexer, parser, evaluator, and context types."

[dependencies]
# Typed errors for every fallible path (lex/parse/eval/hashFiles), per
# AGENTS.md "Errors: thiserror in library crates".
thiserror = "2.0.19"
# `hashFiles`'s documented per-file + outer-digest SHA-256 algorithm
# (see `functions::hash_files` doc comment for the exact GitHub algorithm).
sha2 = "0.11.0"
# Whole-path glob compilation (`*`, `?`, `[...]`, `**`) for `hashFiles`,
# configured to match `@actions/glob`'s minimatch options
# (`dot:true, nobrace:true, noext:true, nonegate:true`, Linux case-sensitive)
# rather than globset's own looser defaults — see `functions::hash_files`.
globset = "0.4.19"
# Linux descriptor-relative opens keep `hashFiles` pinned to the workspace
# directory even while an untrusted checkout is concurrently renamed or
# replaces symlinks. The existing workspace already pins this rustix release.
rustix = { version = "1.1.4", features = ["fs"] }
# Newtonsoft accepts unquoted object keys using .NET's Char.IsLetterOrDigit
# (Unicode General Categories L*/Nd), which Rust's broader `is_alphanumeric`
# cannot reproduce exactly. The 0.6 line pins Unicode 15.0, matching .NET 8.
unicode-general-category = "1.1.0"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "expr_eval"
harness = false
