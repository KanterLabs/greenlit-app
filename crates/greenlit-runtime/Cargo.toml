[package]
name = "greenlit-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ContainerEngine trait, bollard/Docker backend, base images, and overlay isolation."

[features]
default = []
# Genuine Docker, privileged-kernel, and provider acceptance targets are
# deliberately absent from the portable test set. Selecting this feature is
# an assertion that the owning job provisioned every prerequisite; the tests
# then fail hard if that assertion is false.
live-runtime-tests = []

[dependencies]
# The resolved execution plan and the pure GitHub-faithful `run:` step
# semantics (shell resolution, env layering, command files, log commands,
# outcome model, job outputs) the executor drives against a `ContainerEngine`.
# The dataflow is one-directional — workflow → engine(plan) → runtime(execute)
# — so this edge is acyclic (`greenlit-engine` never depends on this crate).
greenlit-engine = { path = "../greenlit-engine", version = "0.1.0" }
# The expression `Context`/`Value`/`RealFs` the executor assembles to finish
# plan-time-deferred `if:`/`env:`/script values against live runtime contexts.
greenlit-expr = { path = "../greenlit-expr", version = "0.1.0" }
# `Span` for the source-located job-container and deferred-construct rejections.
greenlit-workflow = { path = "../greenlit-workflow", version = "0.1.0" }
# Order-preserving env/output maps, matching the engine execution semantics'
# `IndexMap` signatures exactly (env layering, step outputs, job outputs).
indexmap = "2.14.0"
thiserror = "2.0.19"
tracing = "0.1.44"
# Async runtime. Engine access is I/O-bound orchestration (`greenlit-v0-spec.md`
# "Tech"); every `ContainerEngine` method is async on tokio.
tokio = { version = "1.48.0", features = ["rt", "io-util", "time", "macros", "sync"] }
# `#[async_trait]` keeps `ContainerEngine` and `EngineProber` object-safe at
# their external boundaries; native `async fn` in a public trait is not
# dyn-compatible.
async-trait = "0.1.90"
# Docker Engine API client. `AGENTS.md` mandates the Docker API via bollard with
# no shelling out to `docker`.
bollard = "0.21.0"
# The local cache/artifact stores and the shim server that fronts them. The
# runtime owns the job's network, so it is what binds the shim on that
# network's gateway and hands the job the `ACTIONS_*` addresses
# (`PHASE-4-environment.md` "Cache and artifacts").
greenlit-store = { path = "../greenlit-store", version = "0.1.0" }
# Reads the GitHub `runner-images` toolset manifest, which is JSON. Same
# pinned version `greenlit-actions` and `greenlit-store` already use; the
# workspace's chosen deserializer, so no new dependency family.
serde_json = "1.0.145"
# Draining bollard's streaming responses (image pull/build progress, exec output).
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
# `bollard::body_full` takes a `bytes::Bytes`; used to send the base-image build
# context tar to the daemon. Pinned to bollard's own `bytes` version.
bytes = "1.12.1"
# Assembling the in-memory base-image build context (Dockerfile + embedded
# helper) and parsing the exported overlay upper layer for `--write-back`. Both
# are USTAR archives; a maintained tar implementation avoids hand-rolling the
# format and its checksum/whiteout handling.
tar = "0.4.46"
# `--write-back` applies the overlay diff to the host working tree by
# descriptor (`*at()` syscalls with `O_NOFOLLOW`), never through the kernel's
# ordinary symlink-following path lookup — a repository-checked-in symlink
# must never let an applied write escape the working tree (see
# `writeback::host_fs`). Already a pinned workspace dependency
# (`greenlit-expr`'s `hashFiles` hardening); reused here at the same version
# rather than hand-rolling raw libc FFI, which would need `unsafe` in a crate
# that forbids it.
rustix = { version = "1.1.4", features = ["fs", "process"] }
# `uses:` resolution/fetch/manifest types this crate's executor drives to turn
# a resolved action into a ready-to-mount source tree
# (`crates/greenlit-runtime/src/executor/actions`). The dataflow stays
# one-directional (`greenlit-actions` never depends back on this crate).
greenlit-actions = { path = "../greenlit-actions", version = "0.1.0" }
# Downloads the pinned `actions/runner` Node runtime bundles
# (`executor::actions::node_runtime`) — the same blocking HTTP client,
# version, and rustls backend `greenlit-actions` already pins for its own
# real network calls (tarball download, GitHub API), for the identical
# "single static host binary rules out a system-OpenSSL `native-tls` link"
# reasoning; driven via `spawn_blocking` per `AGENTS.md` "no blocking calls
# on the async runtime".
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
# Decompresses the `.tar.gz` framing the pinned Node runtime bundles ship in,
# ahead of unpacking with `tar` (already a dependency above). Same pure-Rust
# `miniz_oxide`-backed crate and version `greenlit-actions` already pins for
# its own tarball fetcher, for the same "no system zlib/C-compiler
# dependency" reasoning.
flate2 = "1.1.9"
# Verifies each downloaded Node runtime bundle against its pinned checksum
# before it is ever extracted or mounted into a job container — a genuine
# integrity check on untrusted network content, unlike `image::context`'s
# FNV cache key. Already a transitive dependency (`greenlit-expr`'s
# `hashFiles` digest use) at this exact version; declared directly here too
# since this crate calls it itself.
sha2 = "0.11.0"
# Direct containerd gRPC transport for configured stargz snapshotter hosts.
# Greenlit defines only the small stable message subset it uses, avoiding
# containerd-client's build-time `protoc` prerequisite and any CLI wrapper.
prost = "0.14.3"
prost-types = "0.14.3"
tonic = { version = "0.14.2", default-features = false, features = ["channel", "codegen"] }
tonic-prost = "0.14.2"
tower = { version = "0.5.3", features = ["util"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio"] }

[dev-dependencies]
# Isolated temp directories for runtime integration and provider acceptance.
# Same version already used elsewhere in the workspace.
tempfile = "3.27.0"

[[test]]
name = "base_image"
path = "tests/base_image.rs"
required-features = ["live-runtime-tests"]

[[test]]
name = "engine_surface"
path = "tests/engine_surface.rs"
required-features = ["live-runtime-tests"]

[[test]]
name = "isolation"
path = "tests/isolation.rs"
required-features = ["live-runtime-tests"]

[[test]]
name = "isolation_overlay"
path = "tests/isolation_overlay.rs"
required-features = ["live-runtime-tests"]

[[test]]
name = "stargz_provider_live"
path = "tests/stargz_provider_live.rs"
required-features = ["live-runtime-tests"]
