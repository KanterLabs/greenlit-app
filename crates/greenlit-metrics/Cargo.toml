[package]
name = "greenlit-metrics"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Timed spans, counters, local NDJSON run records, and stats rendering."

[dependencies]
# Opens real spans around caller-timed stages and instruments async stages.
tracing = "0.1.44"
# Collects the lifecycle of Greenlit's named tracing spans into the local
# invocation record; no formatting or network exporter is installed.
tracing-subscriber = { version = "0.3.22", default-features = false, features = ["registry"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
# Opens the local NDJSON file with Linux no-follow/nonblocking semantics so a
# symlink or special file cannot redirect or stall the metrics boundary.
rustix = { version = "1.1.4", features = ["fs", "process"] }
