# cargo-deny configuration for the greenlit-app workspace.
#
# Policy summary (see ARCHITECTURE.md "Known issues log" for the sole
# duplicate-version exception):
#   - licenses: allowlist of common permissive OSS licenses only.
#   - advisories: RustSec security advisories are denied.
#   - bans: duplicate dependency versions are denied except for one exact,
#     documented syn 2.x transition entry.

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []
# In cargo-deny 0.20 these are scope selectors, so all matching advisories
# retain the command's default deny level.
unmaintained = "all"
unsound = "workspace"
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = true
deny = []
skip = [
    { crate = "syn@2.0.119", reason = "Proc-macro dependencies are split across the syn 2-to-3 transition; see ARCHITECTURE.md" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
