[workspace]
resolver = "2"
members = [
    "crates/greenlit-app",
    "crates/greenlit-workflow",
    "crates/greenlit-expr",
    "crates/greenlit-engine",
    "crates/greenlit-metrics",
    "crates/greenlit-runtime",
    "crates/greenlit-init",
    "crates/greenlit-actions",
    "crates/greenlit-store",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/KanterLabs/greenlit-app"

# Dedicated profile for building the private `greenlit-init` helper as a small,
# static, musl-linked binary for embedding into `litci` and extraction into the
# base-image build context. Used only via
# `cargo build -p greenlit-init --profile init --target x86_64-unknown-linux-musl`;
# it does not affect any crate's normal dev/release/test builds. See the
# embedding contract in
# `crates/greenlit-runtime/embedded-init/src/lib.rs`. The private
# `greenlit-init` package points at that one canonical packaged source tree.
[profile.init]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
